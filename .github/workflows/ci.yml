name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel in-progress runs for the same branch (saves CI minutes on rapid pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    name: "Lint & Format (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: "Lint — ruff check"
        # uvx runs a tool without installing into project venv
        run: uvx ruff check blender_mcp_bridge/ tests/ blender_mcp_addon/

      - name: "Format — ruff format --check"
        run: uvx ruff format --check blender_mcp_bridge/ tests/ blender_mcp_addon/

  # ── 2. Complexity (McCabe via ruff C90) ─────────────────────────────────────
  complexity:
    name: "Complexity Check (McCabe ≤ 12)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: "McCabe complexity — ruff C90"
        # Flags any function/method with cyclomatic complexity > 12
        # Config lives in pyproject.toml [tool.ruff.lint.mccabe]
        run: uvx ruff check --select C90 blender_mcp_bridge/ tests/ blender_mcp_addon/

  # ── 3. Type Check (mypy — blender_mcp_bridge/ only) ────────────────────────────────────────
  #   blender_mcp_addon/ is excluded because `bpy` (Blender Python API)
  #   has no public type stubs and cannot be installed outside Blender.
  type-check:
    name: "Type Check (mypy — blender_mcp_bridge/)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: "Install project + dev deps"
        run: uv sync --group dev

      - name: "mypy — blender_mcp_bridge/"
        run: uv run mypy blender_mcp_bridge/

  # ── 4. Unit tests (no Blender needed) ──────────────────────────────────────
  #   Live-Blender scenarios (tests/run_integration.py, scenarios/) stay a
  #   local lane: CI has no Blender with the addon started.
  unit-tests:
    name: "Unit tests (pytest, offline)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: "Install project + dev deps"
        run: uv sync --group dev

      - name: "pytest — offline suites"
        run: uv run pytest tests/test_tool_schemas.py tests/test_sessions.py tests/test_design_rules.py tests/test_provider_runtime.py tests/test_addon_lifecycle.py tests/test_connection_deadline.py tests/test_document_lifecycle.py tests/test_object_query.py tests/test_organization.py tests/test_common_transform.py -q

  # ── 5. Provider contract consistency ───────────────────────────────────────
  #   docs/tools.md is generated from bridge schemas; the generator also
  #   enforces bridge↔addon dispatch parity and the discipline quarantine.
  contract:
    name: "Contract consistency (tools doc + quarantine)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: "Install project + dev deps"
        run: uv sync --group dev

      - name: "Regenerate tools doc and verify committed copy is fresh"
        run: |
          uv run python scripts/gen_tools_doc.py
          git diff --exit-code -- docs/tools.md
