name: Publish versioned source and wheel release

on:
  push:
    tags: ["v.0.*.*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUIRED_BRANCH: "main"
      REQUIRED_WORKFLOW: "CI"
      RELEASE_SCOPE: >-
        Stable product release numbering; exact-source CI is required. Native app/build
        qualification, artifact installation, owner auth and Gateway activation are separate
        verifiable gates, not implied by the existence of a source release.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Verify exact-source CI and prepare release notes
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/source-ci.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import tomllib

          sha = os.environ["GITHUB_SHA"]
          required = os.environ["REQUIRED_WORKFLOW"]
          runs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-ci.json").read_text())["workflow_runs"]
          matching = [
              run for run in runs
              if run["head_sha"] == sha and run["name"] == required
              and run["head_branch"] == os.environ["REQUIRED_BRANCH"]
              and run["event"] == "push"
          ]
          if not matching:
              raise SystemExit(f"No exact-source CI run found for {required}")
          latest = max(matching, key=lambda run: (run["run_number"], run["run_attempt"]))
          if latest["status"] != "completed" or latest["conclusion"] != "success":
              raise SystemExit(f"Exact-source CI is not successful: {latest['html_url']}")
          if Path("package.json").is_file():
              version = json.loads(Path("package.json").read_text())["version"]
          else:
              version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v\.0\.[0-9]+\.[0-9]+", tag) is None or tag != f"v.{version}":
              raise SystemExit(f"Release tag {tag} != package v{version}")
          notes = (
              f"Versioned source and wheel release **{version}**.\n\n"
              f"- Source commit: \x60{sha}\x60\n"
              f"- Exact-source CI: {latest['html_url']}\n"
              f"- Distribution: GitHub source archives, reproducible wheel, additive Blender addon archive and SHA-256 hashes.\n\n"
              f"{os.environ['RELEASE_SCOPE']}\n"
          )
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(notes, encoding="utf-8")
          print(f"Exact-source CI verified: {sha}")
          PY
      - name: Build versioned wheel and Blender addon archive
        shell: bash
        run: |
          uv build --wheel --out-dir dist
          git archive --format=zip \
            --output="dist/blender_mcp_addon-$GITHUB_REF_NAME.zip" \
            "$GITHUB_SHA" blender_mcp_addon
          (cd dist && sha256sum *.whl *.zip > SHA256SUMS)
      - name: Publish immutable versioned release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.zip dist/SHA256SUMS \
            --verify-tag \
            --title "$GH_REPO — $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
